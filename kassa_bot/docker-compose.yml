name: kassa

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://kassa:${POSTGRES_PASSWORD:-kassa}@postgres:5432/kassa
  REDIS_URL: redis://redis:6379/0

x-app: &app
  build:
    context: .
    target: base
  image: kassa-bot:latest
  env_file: .env
  environment: *app-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kassa
      POSTGRES_USER: kassa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kassa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kassa -d kassa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Migratsiya + boshlang‘ich ma’lumotlar (VIP darajalar, namuna promokodlar, ENV adminlar)
  migrate:
    build:
      context: .
      target: base
    image: kassa-bot:latest
    env_file: .env
    environment: *app-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # FastAPI: provayder webhooklari, sandbox sahifalari, BOT_MODE=webhook bo‘lsa Telegram webhook
  api:
    <<: *app
    command: ["uvicorn", "app.webhooks.app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Long-polling bot (BOT_MODE=webhook bo‘lsa darhol 0 kod bilan chiqadi)
  bot:
    <<: *app
    command: ["python", "-m", "app.bot"]
    restart: on-failure

  # Background worker: payout navbati, retry/backoff, expiry, reconciliation, hisobotlar
  worker:
    <<: *app
    command: ["python", "-m", "app.jobs"]

  # Userbot: bank xabarlarini (CardXabar, HUMO) o‘qib, P2P to‘lovlarni avtomatik tasdiqlaydi.
  # Faqat bitta nusxa ishga tushiring (bir sessiya — bir ulanish).
  userbot:
    <<: *app
    command: ["python", "-m", "app.userbot"]

  # Web App uchun vaqtinchalik HTTPS manzil (domen bo‘lmasa, test uchun):
  #   docker compose --profile tunnel up -d tunnel && docker compose logs tunnel | grep trycloudflare
  # Chiqqan https://....trycloudflare.com manzilini .env → PUBLIC_BASE_URL ga yozib,
  # `docker compose up -d` bilan qayta ishga tushiring. Manzil har restartda o‘zgaradi.
  tunnel:
    image: cloudflare/cloudflared:2024.8.3
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]
    profiles: ["tunnel"]
    depends_on:
      - api
    restart: unless-stopped

  # Testlar: docker compose --profile test run --rm tests
  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://kassa:${POSTGRES_PASSWORD:-kassa}@postgres:5432/kassa_test
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
